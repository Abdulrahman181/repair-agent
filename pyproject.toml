[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repairagent"
version = "0.1.0"
description = "Sandboxed code-repair agent with hidden-test verification and a reproducible evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "pytest>=8",
]

[project.optional-dependencies]
dev = ["pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
repairagent = "repairagent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = ["posix_only: test relies on POSIX process limits"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/repairagent/agent/prompts.py" = ["E501"]
